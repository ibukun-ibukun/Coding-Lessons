<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Learning the DOM element">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM (Document Object Model)</title>
</head>
<body>
    <h1 id="title">Welcome to the Store</h1>

    <section class="card">
        <article id="inner">
            <p>TThe webpage is starting to come alive</p>
        </article>
    </section>

    <section class="card">
        <article>
            <p>Test Running how DOM works</p>
        </article>
    </section>

    <section class="card" id="last-item">
        <article>
            <p class="changes">We'd see how it goes</p>
        </article>
    </section>

    <ul id="card-list"></ul>
    <div class="product-card">
        <p>Blender</p>
        <!--<button onclick="removeCard(this)">Remove</button>
        -->
        
        <button id="btn">Remove</button>
    </div>

    <select name="product" id="category-filter">
        <option value="all">All</option>
        <option value="donkeys">donkeys</option>
        <option value="toy car">Toy car</option>
        <option value="blocks">Blocks</option>
    </select>

    <form action="">
        <label for="firstname">First Name</label>
        <input type="text" name="first" id="">

        <label for="email">Email</label>
        <input type="email" name="email" id="email">

        <button type="submit">Add to Cart</button>
    </form>

    <input type="text" id="search-box" placeholder="Search for product">
    
    <script   src="events.js"></script>
    
</body>
</html>
